<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$ — wg</title>
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <style>
        /* document-specific overrides */
        h1 { font-size: 22px; margin-bottom: 0.5em; margin-top: 2em; }
        h1:first-of-type { margin-top: 0; }
        h2 { font-size: 17px; font-weight: 700; text-transform: none; margin-top: 1.75em; margin-bottom: 0.5em; }
        h3 { font-size: 15px; font-weight: 700; margin-top: 1.5em; margin-bottom: 0.5em; }
        h4 { font-size: 14px; font-weight: 700; margin-top: 1.25em; margin-bottom: 0.5em; }

        nav#TOC { margin-bottom: 2.5em; }
        nav#TOC > ul { list-style: none; padding: 0; }
        nav#TOC ul ul { padding-left: 1.25em; }
        nav#TOC li { margin: 0.2em 0; }
        nav#TOC a { font-family: 'JetBrains Mono', monospace; font-size: 13px; }

        .back { font-family: 'JetBrains Mono', monospace; font-size: 14px; margin-bottom: 1.5em; display: block; }

        table { border-collapse: collapse; margin: 0.75em 0; font-size: 14px; }
        th, td { border: 1px solid var(--viz-border); padding: 0.4em 0.75em; text-align: left; }
        th { font-weight: 700; background: var(--viz-bg); }

        blockquote { border-left: 3px solid var(--viz-border); padding-left: 1em; margin: 0.75em 0; color: var(--fg2); }

        pre { background: var(--viz-bg); border: 1px solid var(--viz-border); border-radius: 4px; padding: 0.75em 1em; }
        code { font-family: 'JetBrains Mono', monospace; font-size: 0.875em; }

        ul, ol { padding-left: 1.5em; margin-bottom: 0.75em; }
        li { margin-bottom: 0.25em; }

        .sourceCode { overflow-x: auto; }
    </style>
</head>
<body>
<a class="back" href="index.html">← wg</a>
$if(toc)$
<nav id="TOC" role="doc-toc">
$table-of-contents$
</nav>
$endif$
$body$
</body>
</html>
